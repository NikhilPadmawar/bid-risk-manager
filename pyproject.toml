[project]
name = "bid-risk-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.55",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
